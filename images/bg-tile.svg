<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Seamless wallpaper: teal and pink quatrefoils on pale mint">
  <!--
    The page background. Hand-written, not generated by tools/make_art.py.
    90s plastic-tableware palette kept deliberately low-contrast: this is
    wallpaper behind the game, not a pattern competing with it. The silver
    panels have to stay readable on top, so nothing here is darker than
    roughly 40% and nothing is fully saturated.
  -->
  <rect width="40" height="40" fill="#c9e4dc"/>

  <!-- teal quatrefoils, on one diagonal -->
  <g fill="#3f9e91" opacity="0.42">
    <g transform="translate(10 10)">
      <circle cx="0" cy="-3" r="2.7"/>
      <circle cx="0" cy="3" r="2.7"/>
      <circle cx="-3" cy="0" r="2.7"/>
      <circle cx="3" cy="0" r="2.7"/>
    </g>
    <g transform="translate(30 30)">
      <circle cx="0" cy="-3" r="2.7"/>
      <circle cx="0" cy="3" r="2.7"/>
      <circle cx="-3" cy="0" r="2.7"/>
      <circle cx="3" cy="0" r="2.7"/>
    </g>
  </g>

  <!-- hot pink quatrefoils on the other, smaller and fainter -->
  <g fill="#e0709f" opacity="0.34">
    <g transform="translate(30 10)">
      <circle cx="0" cy="-2.3" r="2.2"/>
      <circle cx="0" cy="2.3" r="2.2"/>
      <circle cx="-2.3" cy="0" r="2.2"/>
      <circle cx="2.3" cy="0" r="2.2"/>
    </g>
    <g transform="translate(10 30)">
      <circle cx="0" cy="-2.3" r="2.2"/>
      <circle cx="0" cy="2.3" r="2.2"/>
      <circle cx="-2.3" cy="0" r="2.2"/>
      <circle cx="2.3" cy="0" r="2.2"/>
    </g>
  </g>

  <!-- lime centres, and a few single petals to keep the rhythm going -->
  <g fill="#9cc95c" opacity="0.5">
    <circle cx="10" cy="10" r="1.2"/>
    <circle cx="30" cy="30" r="1.2"/>
  </g>
  <g fill="#ffffff" opacity="0.45">
    <circle cx="20" cy="0" r="1.1"/>
    <circle cx="0" cy="20" r="1.1"/>
    <circle cx="20" cy="20" r="1.1"/>
  </g>
</svg>
